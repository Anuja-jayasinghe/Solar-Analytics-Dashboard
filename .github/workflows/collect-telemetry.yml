name: Collect Inverter Telemetry

# =============================================================
# WHY THIS EXISTS (v3, issue #156)
# =============================================================
# Builds the inverter uptime/interruption log. For each of the last 7 COMPLETED days it pulls
# SolisCloud's `inverterDay` (one point per logger upload, 129 fields), `collector/day` (logger
# heartbeats) and `alarmList` (paginated), stores them, and derives per-day uptime (LR-002).
#
# Why not our own 5-minute polling? It only runs 05:00-19:55, GitHub cron drifts and skips, it
# stores few fields, and its rows are pruned after 14 days. SolisCloud's own history is complete
# and reaches back at least two years. See docs/SOLIS_API_FIELD_CATALOG.md.
#
# Re-processing the last 7 days every night is deliberate: every write is an upsert on a natural
# key, so reruns are harmless, and late-arriving alarms/points are picked up automatically.
#
# A run that processes nothing is a FAILURE (project rule), as is any failed day or a failed
# alarm fetch. Failure opens/updates the shared `data-outage` issue.
#
# Table writes: inverter_telemetry, collector_heartbeats, inverter_alarms, inverter_day_uptime,
# inverter_status_segments, collector_runs (all private; service_role only).
# =============================================================

on:
  schedule:
    # 00:15 Sri Lanka time (UTC+5:30) => 18:45 UTC. Yesterday is complete by then.
    - cron: '45 18 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'How many completed days to (re)process, ending yesterday'
        required: false
        default: '7'
      dry_run:
        description: 'Preview only: report what would be written, write nothing'
        type: boolean
        required: true
        default: false

concurrency:
  group: collect-telemetry
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  collect:
    name: Collect telemetry
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 📚 Install Dependencies
        run: pnpm install --no-frozen-lockfile --prefer-offline

      - name: 📡 Collect telemetry
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SOLIS_API_URL: ${{ secrets.SOLIS_API_URL }}
          SOLIS_API_ID: ${{ secrets.SOLIS_API_ID }}
          SOLIS_API_SECRET: ${{ secrets.SOLIS_API_SECRET }}
          NODE_ENV: production
          DAYS: ${{ github.event.inputs.days || '7' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          # Scheduled runs write; a manual run writes unless dry_run is ticked.
          if [ "$DRY_RUN" = "true" ]; then WRITE=""; else WRITE="--write"; fi
          node functions/collect_telemetry/index.js --days "$DAYS" $WRITE

      - name: 🚨 Notify on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          gh label create data-outage \
            --description "Inverter data collection has stopped" \
            --color B60205 2>/dev/null || true

          BODY="\`Collect Inverter Telemetry\` failed at $(date -u +"%Y-%m-%d %H:%M UTC").

          The uptime log (\`inverter_telemetry\`, \`inverter_alarms\`, \`inverter_day_uptime\`) did not
          fully update. The run summary lists which days failed and why.

          **Run:** $RUN_URL

          Check the run log, then the \`SOLIS_*\` / \`SUPABASE_*\` repo secrets. Recover any gap with
          the **Backfill Inverter Telemetry** workflow (dry run is the default)."

          EXISTING=$(gh issue list --repo "$REPO" --label data-outage --state open \
                       --limit 1 --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" \
              --title "🔴 Inverter data collection has stopped" \
              --label data-outage \
              --body "$BODY"
          fi
