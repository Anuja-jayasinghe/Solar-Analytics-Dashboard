name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # These used to run with --if-present, which means "pass silently if the script does
      # not exist". `test` and `typecheck` were never defined, so two of the four gates were
      # theatre: CI went green having verified nothing. They are now invoked directly, so a
      # missing script fails the build rather than being waved through.
      #
      # `typecheck` is deliberately absent: this is a plain JavaScript project with no
      # tsconfig, so there is nothing to typecheck. Adding a step back would just recreate
      # the no-op. If TypeScript or checkJs is introduced later, add it here for real.
      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      # 61 advisories — two of them critical — accumulated unnoticed because nothing ever
      # looked. Fails only on production-reachable problems: the dev toolchain (vite, rollup,
      # eslint, babel) carries a long tail of advisories that never reach a user, and gating
      # on those would train everyone to ignore this step.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  # Playwright smoke suite against the production build (e2e/smoke.spec.js): the v3 app as a
  # signed-out visitor on demo data, with fake Supabase credentials and no Clerk key. Checks that
  # the pages render, the gates hold, old addresses redirect, and no real data is requested.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke tests
        run: pnpm test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
