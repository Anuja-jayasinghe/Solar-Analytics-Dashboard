name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # These used to run with --if-present, which means "pass silently if the script does
      # not exist". `test` and `typecheck` were never defined, so two of the four gates were
      # theatre: CI went green having verified nothing. They are now invoked directly, so a
      # missing script fails the build rather than being waved through.
      #
      # `typecheck` is deliberately absent: this is a plain JavaScript project with no
      # tsconfig, so there is nothing to typecheck. Adding a step back would just recreate
      # the no-op. If TypeScript or checkJs is introduced later, add it here for real.
      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # 61 advisories — two of them critical — accumulated unnoticed because nothing ever
      # looked. Fails only on production-reachable problems: the dev toolchain (vite, rollup,
      # eslint, babel) carries a long tail of advisories that never reach a user, and gating
      # on those would train everyone to ignore this step.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
