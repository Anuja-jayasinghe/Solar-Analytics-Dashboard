name: Generate Daily Inverter Summary

# =============================================================
# WORKFLOW PURPOSE
# =============================================================
# Aggregates inverter live data into daily summaries with backfill capability.
# Summary fields: total_generation_kwh (max cumulative today), peak_power_kw (max power).
# Runs twice daily at 07:00 AM and 07:00 PM Sri Lanka time to ensure data availability.
# Features:
# - Backfills last 30 days of missing or incomplete summaries
# - Updates records if new data differs from existing
# - Skips updating today's record if run before 23:00 local time
# - Can be run manually to backfill/correct any missing data
# Table: public.inverter_data_daily_summary
# =============================================================

on:
  schedule:
    # 07:00 AM Sri Lanka time (UTC+5:30) => 01:30 UTC
    - cron: '30 1 * * *'
    # 07:00 PM Sri Lanka time (UTC+5:30) => 13:30 UTC
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug logging'
        required: false
        default: 'false'

concurrency:
  group: generate-daily-inverter-summary
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  generate-daily-summary:
    name: Generate Daily Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 📚 Install Dependencies
        run: pnpm install --no-frozen-lockfile --prefer-offline

      - name: 🧮 Generate Daily Inverter Summary
        run: node functions/generate_daily_summary/index.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SOLIS_API_URL: ${{ secrets.SOLIS_API_URL }}
          SOLIS_API_ID: ${{ secrets.SOLIS_API_ID }}
          SOLIS_API_SECRET: ${{ secrets.SOLIS_API_SECRET }}
          NODE_ENV: production
          DEBUG: ${{ github.event.inputs.debug || 'false' }}

      # A failure here used to print to a log nobody reads. Raise something that reaches you:
      # a labelled issue, reused rather than duplicated, and closed automatically by the
      # Data Freshness Check once rows start arriving again.
      - name: 🚨 Notify on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          gh label create data-outage \
            --description "Inverter data collection has stopped" \
            --color B60205 2>/dev/null || true

          BODY="\`Generate Daily Inverter Summary\` failed at $(date -u +"%Y-%m-%d %H:%M UTC").

          No new rows were written to \`inverter_data_daily_summary\` on this run. If this
          repeats, the dashboard's generation charts will start showing a gap.

          **Run:** $RUN_URL

          Check the run log first, then the \`SOLIS_*\` / \`SUPABASE_*\` repo secrets.
          Once fixed, refill any gap with the **Backfill Daily Summaries** workflow."

          EXISTING=$(gh issue list --repo "$REPO" --label data-outage --state open \
                       --limit 1 --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" \
              --title "🔴 Inverter data collection has stopped" \
              --label data-outage \
              --body "$BODY"
          fi
